apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 806157700335.dkr.ecr.ap-south-1.amazonaws.com/frontend:v1

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"