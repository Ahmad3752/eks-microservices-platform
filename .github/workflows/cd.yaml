name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 806157700335

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:${{ github.sha }} \
            ./microservices-app/frontend

      - name: Build backend
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/backend:${{ github.sha }} \
            ./microservices-app/backend

      - name: Push frontend
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:${{ github.sha }}

      - name: Push backend
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/backend:${{ github.sha }}


  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name my-app-cluster \
            --region $AWS_REGION

      - name: Deploy frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --namespace microservices-dev \
            --create-namespace \
            -f ./helm/frontend/values-dev.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m

      - name: Deploy backend
        run: |
          helm upgrade --install backend ./helm/backend \
            --namespace microservices-dev \
            --create-namespace \
            -f ./helm/backend/values-dev.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend -n microservices-dev
          kubectl rollout status deployment/backend -n microservices-dev


  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name my-app-cluster \
            --region $AWS_REGION

      - name: Deploy frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --namespace microservices-staging \
            --create-namespace \
            -f ./helm/frontend/values-staging.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m

      - name: Deploy backend
        run: |
          helm upgrade --install backend ./helm/backend \
            --namespace microservices-staging \
            --create-namespace \
            -f ./helm/backend/values-staging.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend -n microservices-staging
          kubectl rollout status deployment/backend -n microservices-staging


  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name my-app-cluster \
            --region $AWS_REGION

      - name: Deploy frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --namespace microservices-prod \
            --create-namespace \
            -f ./helm/frontend/values-prod.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m

      - name: Deploy backend
        run: |
          helm upgrade --install backend ./helm/backend \
            --namespace microservices-prod \
            --create-namespace \
            -f ./helm/backend/values-prod.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend -n microservices-prod
          kubectl rollout status deployment/backend -n microservices-prod